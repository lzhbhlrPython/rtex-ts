name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pack
  tex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v6
        id: tex-cache
        with:
          path: build/texlive
          key: texlive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-texlive.sh', 'scripts/texlive.profile') }}
      - name: Install and configure real TeX Live
        run: |
          bash scripts/install-texlive.sh
          source build/texlive.env
          echo "RTEX_TEXLIVE_BIN=$RTEX_TEXLIVE_BIN" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            cygpath -w "$RTEX_TEXLIVE_BIN" >> "$GITHUB_PATH"
          else
            echo "$RTEX_TEXLIVE_BIN" >> "$GITHUB_PATH"
          fi
      - uses: actions/cache/save@v6
        if: steps.tex-cache.outputs.cache-hit != 'true'
        with:
          path: build/texlive
          key: ${{ steps.tex-cache.outputs.cache-primary-key }}
      - run: npm ci
      - run: npm run test:tex
